# Serves the web app's frontend and forwards /api to the web backend.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://web-backend:3001;
        proxy_http_version 1.1;
        # Server-Sent Events: no buffering, and keep long-lived streams open.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
