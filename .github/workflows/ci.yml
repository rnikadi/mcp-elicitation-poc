name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the Compose file, including the client profile
        run: docker compose --profile client config --quiet
      - name: Start the demo with Docker Compose
        run: docker compose up --build --detach --wait
      - name: Smoke test against the running stack
        run: npm run smoke
      - name: Smoke test the web app (frontend on :8080 → web backend → server)
        run: npm run smoke:web
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down
